schema: spec-driven

context: |
  Project: fahmm (Fah Meeting Minutes), a free, open-source Windows desktop app with an English-default UI, a Vietnamese switch, and Vietnamese-first speech recognition and minutes.
  Source of truth for v1 requirements: docs/requirements-v1.md (FR-01..FR-39, PR-01..PR-08, AT-01..AT-11).
  Target: Windows 10/11 x64. No required account, server, subscription, API key, or GPU.
  Core flow: Record or import -> local transcription -> review transcript -> meeting minutes -> export.
  New meetings default to Internal/Restricted. Audio, transcript, minutes, and meeting context stay local in this mode.
  Never fall back from local processing to a cloud endpoint. Cloud summarization requires the user to mark the meeting as shareable and confirm each send with the destination and payload disclosed.
  Without a local LLM, offline minutes are an extractive draft with source timestamps, not a semantic AI summary.
  M1 is the Windows recorder (system audio + microphone, pause/stop, crash recovery); its acceptance tests are AT-01, AT-02, and AT-10.
  Write repository documentation and OpenSpec artifacts in English. The desktop UI supports English and Vietnamese; preserve Vietnamese as the default transcription and minutes language.

