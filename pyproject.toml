[project]
name = "fahmm"
version = "0.1.0"
description = "Local-first Windows meeting recorder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "av>=14,<19",
    "ctranslate2>=4.9.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "numpy>=2.0,<3",
    "openai>=2,<3",
    "openpyxl>=3.1,<4",
    "psutil>=6,<8",
    "pydantic>=2,<3",
    "pypdf>=5,<8",
    "python-docx>=1.1,<2",
    "requests>=2,<3",
    "SoundCard>=0.4,<0.5",
]

[project.optional-dependencies]
legacy-qt = ["PySide6>=6.8,<7"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# UI/thread boundaries must display and retain unexpected capture/storage errors.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
