[project]
name = "fahmm"
version = "0.1.0"
description = "Local-first Windows meeting recorder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3",
    "PySide6>=6.8,<7",
    "SoundCard>=0.4,<0.5",
]

[project.scripts]
fahmm = "fahmm.app:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# UI/thread boundaries must display and retain unexpected capture/storage errors.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
